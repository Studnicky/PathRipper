name: changelog

on:
  pull_request:
    branches: [develop, master]

jobs:
  enforce:
    name: CHANGELOG entry required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md was modified
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
          else
            echo "CHANGELOG.md must be updated under '## [Unreleased]' for every PR."
            echo "If this PR truly has no user-visible effect, mention so in the PR description"
            echo "and add a one-line note under 'Unreleased' anyway."
            exit 1
          fi
