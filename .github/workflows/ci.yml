name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest]
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        shell: bash
        run: |
          test -f dist/cli/cli.js
          test -f dist/run/runDag.js
          test -f dist/dispatcher/RipperDagonizer.js
          test -f dist/crawlers/crawl-discover.dag.jsonld
          test -f dist-workers/workers/ParseRegistryModule.js

      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high
